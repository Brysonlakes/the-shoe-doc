<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE SHOE DOC · My Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --gold: #D4AF37;
            --gold-light: #F9D976;
            --gold-gradient: linear-gradient(135deg, #F9D976 0%, #D4AF37 50%, #B8860B 100%);
            --gold-glow: 0 0 30px rgba(212,175,55,0.3);
            --dark-bg: #0A0A0A;
            --dark-card: #141414;
            --dark-surface: #1A1A1A;
            --white: #FFFFFF;
            --off-white: #E0E0E0;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }
        body { font-family:var(--font-sans); background:var(--dark-bg); color:var(--off-white); min-height:100vh; padding:24px; }
        .container { max-width:900px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.05); margin-bottom:30px; flex-wrap:wrap; gap:12px; }
        .header h1 { font-family:var(--font-serif); font-size:1.6rem; }
        .header h1 span { background:var(--gold-gradient); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .header .btn { padding:8px 20px; border:1px solid #333; border-radius:30px; background:transparent; color:#aaa; cursor:pointer; transition:0.3s; font-weight:500; text-decoration:none; }
        .header .btn:hover { border-color:var(--gold); color:var(--gold); }
        .welcome-box { background:var(--dark-card); padding:24px 28px; border-radius:16px; border:1px solid rgba(212,175,55,0.1); margin-bottom:30px; }
        .welcome-box h2 { font-family:var(--font-serif); font-size:1.4rem; color:var(--white); }
        .welcome-box h2 span { color:var(--gold); }
        .welcome-box p { color:#888; margin-top:4px; }
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr)); gap:16px; margin-bottom:30px; }
        .stat-card { background:var(--dark-card); padding:16px 20px; border-radius:12px; border:1px solid rgba(255,255,255,0.04); text-align:center; }
        .stat-card .label { font-size:0.7rem; text-transform:uppercase; letter-spacing:1px; color:#666; }
        .stat-card .value { font-family:var(--font-serif); font-size:1.8rem; color:var(--gold); margin-top:4px; }
        .bookings-table { background:var(--dark-card); border-radius:16px; padding:20px; border:1px solid rgba(255,255,255,0.04); overflow-x:auto; }
        .bookings-table h3 { font-family:var(--font-serif); margin-bottom:16px; }
        table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        th { text-align:left; padding:10px 8px; color:#888; font-weight:600; text-transform:uppercase; font-size:0.65rem; letter-spacing:1px; border-bottom:1px solid #222; }
        td { padding:10px 8px; border-bottom:1px solid #1a1a1a; }
        .status-badge { padding:4px 14px; border-radius:30px; font-size:0.65rem; font-weight:600; text-transform:uppercase; }
        .status-pending_payment { background:#ffc10720; color:#ffc107; border:1px solid #ffc10740; }
        .status-paid { background:#17a2b820; color:#17a2b8; border:1px solid #17a2b840; }
        .status-confirmed { background:#28a74520; color:#28a745; border:1px solid #28a74540; }
        .status-completed { background:#28a74520; color:#28a745; border:1px solid #28a74540; }
        .empty-state { text-align:center; padding:40px 20px; color:#666; }
        .empty-state .icon { font-size:3rem; margin-bottom:12px; }
        .empty-state a { color:var(--gold); text-decoration:none; }
        .empty-state a:hover { text-decoration:underline; }
        .affiliate-section { background:var(--dark-card); border-radius:16px; padding:20px; border:1px solid rgba(212,175,55,0.1); margin-top:20px; }
        .affiliate-section h3 { font-family:var(--font-serif); color:var(--white); margin-bottom:12px; border-left:4px solid var(--gold); padding-left:12px; }
        .affiliate-code-box { background:rgba(212,175,55,0.08); border:1px solid rgba(212,175,55,0.2); border-radius:12px; padding:16px; text-align:center; margin:10px 0; }
        .affiliate-code-box .code { font-size:1.5rem; font-weight:700; color:var(--gold); letter-spacing:3px; font-family:monospace; }
        @media (max-width:480px) { .header h1 { font-size:1.2rem; } .stats-grid { grid-template-columns:1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👟 <span>THE SHOE DOC</span></h1>
            <div>
                <a href="index.html" class="btn" onclick="logout()">🚪 Logout</a>
            </div>
        </div>

        <div class="welcome-box" id="welcomeBox">
            <h2>Welcome, <span id="customerName">Customer</span> 👋</h2>
            <p>Here's your booking history and account overview.</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="label">Total Bookings</div><div class="value" id="totalBookings">0</div></div>
            <div class="stat-card"><div class="label">Pending</div><div class="value" id="pendingBookings">0</div></div>
            <div class="stat-card"><div class="label">Completed</div><div class="value" id="completedBookings">0</div></div>
            <div class="stat-card"><div class="label">Total Spent</div><div class="value" id="totalSpent">R0</div></div>
        </div>

        <div class="bookings-table">
            <h3>📋 Your Booking History</h3>
            <div id="bookingsList"></div>
        </div>

        <div class="affiliate-section">
            <h3>💰 Become an Affiliate</h3>
            <p style="color:#888; margin-bottom:12px;">Earn R20 per pair you refer. Start earning today!</p>
            <a href="affiliate-register.html" class="btn" style="display:inline-block; padding:10px 24px; border:1px solid var(--gold); border-radius:30px; color:var(--gold); text-decoration:none;">Become an Affiliate</a>
        </div>
    </div>

    <script>
        function getData(key, fallback) { const data = localStorage.getItem(key); if (data) { try { return JSON.parse(data); } catch(e) { return fallback; } } return fallback; }
        function getBookings() { return getData('shoeDocBookings', []); }

        function logout() { localStorage.removeItem('currentCustomer'); localStorage.removeItem('rememberedUser'); }

        function loadDashboard() {
            const customerData = localStorage.getItem('currentCustomer');
            if (!customerData) { window.location.href = 'index.html'; return; }
            const customer = JSON.parse(customerData);
            const allBookings = getBookings();
            const customerBookings = allBookings.filter(b =>
                (b.email && b.email.toLowerCase() === customer.email.toLowerCase()) ||
                (b.phone && b.phone.replace(/\s/g, '') === customer.phone.replace(/\s/g, ''))
            );
            document.getElementById('customerName').textContent = customer.name || customer.customer || 'Customer';
            const total = customerBookings.length;
            const pending = customerBookings.filter(b => b.status === 'pending_payment' || b.status === 'pending').length;
            const completed = customerBookings.filter(b => b.status === 'completed').length;
            const totalSpent = customerBookings.reduce((sum, b) => sum + (b.totalDue || 0), 0);
            document.getElementById('totalBookings').textContent = total;
            document.getElementById('pendingBookings').textContent = pending;
            document.getElementById('completedBookings').textContent = completed;
            document.getElementById('totalSpent').textContent = 'R' + totalSpent;

            const container = document.getElementById('bookingsList');
            if (customerBookings.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>You haven't made any bookings yet.</p><p><a href="booking.html">Book your first cleaning now!</a></p></div>`;
                return;
            }
            let html = `<table><thead><tr><th>Invoice</th><th>Service</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>`;
            customerBookings.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            customerBookings.forEach(b => {
                const statusClass = `status-${b.status}`;
                const statusText = b.status.charAt(0).toUpperCase() + b.status.slice(1).replace('_', ' ');
                html += `<tr><td><strong>${b.invoice || 'N/A'}</strong></td><td>${b.service}</td><td>${b.date}</td><td>R${b.totalDue || 0}</td><td><span class="status-badge ${statusClass}">${statusText}</span></td></tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
        window.onload = loadDashboard;
    </script>
</body>
</html>
