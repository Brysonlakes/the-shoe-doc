<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE SHOE DOC · Login</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E0E0E0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#141414;border-radius:24px;padding:40px 32px;border:1px solid rgba(212,175,55,.15);width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.8)}
.logo{font-family:'Playfair Display',serif;font-size:2rem;text-align:center;background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.sub{color:#888;text-align:center;font-size:.9rem;margin-bottom:24px}
.tabs{display:flex;background:#1A1A1A;border-radius:50px;padding:4px;margin-bottom:24px}
.tabs button{flex:1;padding:10px;border:none;border-radius:50px;background:transparent;color:#888;font-weight:600;font-size:.85rem;cursor:pointer;transition:.3s}
.tabs button.active{background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);color:#000}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.85rem;font-weight:600;color:#aaa;margin-bottom:4px}
.fg input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff;font-size:1rem;outline:none;font-family:inherit}
.fg input:focus{border-color:#D4AF37}
.btn{width:100%;padding:14px;border:none;border-radius:50px;font-weight:700;font-size:1rem;background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);color:#000;cursor:pointer;margin-top:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(212,175,55,.3)}
.btn2{display:block;text-align:center;text-decoration:none;padding:12px;border:1px solid #333;border-radius:50px;color:#aaa;font-weight:600;margin-top:10px;font-size:.9rem;cursor:pointer;background:transparent;width:100%}
.btn2:hover{border-color:#D4AF37;color:#D4AF37}
.msg{margin-top:12px;font-size:.85rem;text-align:center;display:none;padding:10px;border-radius:8px}
.msg.err{display:block;color:#ff4d4d;background:rgba(255,77,77,.1)}
.msg.ok{display:block;color:#28a745;background:rgba(40,167,69,.1)}
.hide{display:none}
.link{color:#D4AF37;cursor:pointer;text-decoration:underline;font-weight:600}
.switcher{text-align:center;margin-top:12px;font-size:.85rem;color:#888}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);z-index:1000;justify-content:center;align-items:center;padding:20px;overflow-y:auto}
.modal.on{display:flex}
.mbox{background:#141414;border-radius:24px;padding:32px;border:1px solid rgba(212,175,55,.2);max-width:440px;width:100%;position:relative;max-height:95vh;overflow-y:auto}
.close{position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:1.8rem;cursor:pointer}
.mbox h2{font-family:'Playfair Display',serif;color:#fff;font-size:1.5rem;margin-bottom:6px}
.mbox p.sub{color:#888;font-size:.9rem;margin-bottom:20px}
@media(max-width:480px){.box{padding:28px 20px}.mbox{padding:24px 20px}}
</style>
</head>
<body>
<div class="box">
<div class="logo">THE SHOE DOC</div>
<p class="sub">Sign in to your account</p>

<div class="tabs">
<button class="active" data-role="admin" onclick="switchRole('admin')">👑 Admin</button>
<button data-role="customer" onclick="switchRole('customer')">👤 Customer</button>
<button data-role="affiliate" onclick="switchRole('affiliate')">💰 Affiliate</button>
</div>

<!-- ADMIN -->
<div id="adminFields">
<div class="fg"><label>Username</label><input type="text" id="aUser" placeholder="admin"></div>
<div class="fg"><label>Password</label><input type="password" id="aPass" placeholder="••••••"></div>
</div>

<!-- CUSTOMER -->
<div id="customerFields" class="hide">
<div class="fg"><label>Email</label><input type="email" id="cEmail" placeholder="you@email.com"></div>
<div class="fg"><label>Password</label><input type="password" id="cPass" placeholder="••••••"></div>
</div>

<!-- AFFILIATE -->
<div id="affiliateFields" class="hide">
<div class="fg"><label>Email</label><input type="email" id="fEmail" placeholder="you@email.com"></div>
<div class="fg"><label>Password</label><input type="password" id="fPass" placeholder="••••••"></div>
</div>

<button class="btn" onclick="doLogin()">Sign In</button>
<div id="msg" class="msg"></div>

<div id="customerSwitch" class="switcher hide">
New customer? <span class="link" onclick="openRegister()">Register here</span>
</div>

<a href="booking.html" class="btn2">📅 Book Now (No Login Required)</a>
<button class="btn2" style="border-color:#28a745;color:#28a745" onclick="location.href='affiliate-register.html'">💰 Become an Affiliate</button>
</div>

<!-- REGISTER MODAL -->
<div class="modal" id="regModal">
<div class="mbox">
<button class="close" onclick="closeRegister()">&times;</button>
<h2>📝 Create Customer Account</h2>
<p class="sub">Register to track your bookings and earn reward points.</p>

<div class="fg"><label>Full Name *</label><input type="text" id="rName" placeholder="Thabo M."></div>
<div class="fg"><label>Email *</label><input type="email" id="rEmail" placeholder="you@email.com"></div>
<div class="fg"><label>Phone *</label><input type="tel" id="rPhone" placeholder="082 123 4567"></div>
<div class="fg"><label>Password *</label><input type="password" id="rPass" placeholder="Min 6 characters"></div>
<div class="fg"><label>Confirm Password *</label><input type="password" id="rPass2" placeholder="Repeat password"></div>

<button class="btn" onclick="doRegister()">Create Account</button>
<div id="rMsg" class="msg"></div>
</div>
</div>

<script>
// ============ SUPABASE ============
var SB_URL='https://nvrsiiwkdsqgtsaokubn.supabase.co';
var SB_KEY='sb_publishable_yiBiiJvpawWZSw1pzVBPLg_gU3-JNJp';
var db=window.supabase.createClient(SB_URL,SB_KEY);

// ============ BREVO ============
var BREVO_KEY='';
var SENDER_EMAIL='theshoedoc3@gmail.com';
var SENDER_NAME='THE SHOE DOC';
var ADMIN_EMAIL='theshoedoc3@gmail.com';

db.from('settings').select('*').eq('key','brevo_api_key').then(function(r){
  if(r.data && r.data.length>0){
    BREVO_KEY=r.data[0].value;
    console.log('✅ Brevo key loaded');
  }
});

function sendMail(toEmail, subject, htmlContent){
  if(!BREVO_KEY){console.warn('⚠️ Email skipped — key not loaded');return;}
  fetch('https://api.brevo.com/v3/smtp/email',{
    method:'POST',
    headers:{'accept':'application/json','content-type':'application/json','api-key':BREVO_KEY},
    body:JSON.stringify({
      sender:{name:SENDER_NAME,email:SENDER_EMAIL},
      to:[{email:toEmail}],
      subject:subject,
      htmlContent:htmlContent
    })
  }).then(function(r){
    if(r.ok)console.log('✅ Email sent to '+toEmail);
    else r.json().then(function(e){console.error('❌ Brevo:',e);});
  }).catch(function(err){console.error('❌ Network:',err);});
}

// ============ EMAIL TEMPLATE ============
function emailLayout(title, bodyHtml){
  return ''+
  '<div style="font-family:Arial,Helvetica,sans-serif;background:#0A0A0A;padding:30px 15px;color:#E0E0E0">'+
    '<div style="max-width:560px;margin:0 auto;background:#141414;border:1px solid #D4AF37;border-radius:16px;overflow:hidden">'+
      '<div style="background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);padding:24px;text-align:center">'+
        '<h1 style="margin:0;font-family:Georgia,serif;font-size:26px;color:#000;letter-spacing:2px">THE SHOE DOC</h1>'+
        '<p style="margin:4px 0 0;font-size:12px;color:#3a2a00">Premium Shoe Cleaning · East London</p>'+
      '</div>'+
      '<div style="padding:24px 28px 0">'+
        '<h2 style="margin:0;color:#D4AF37;font-family:Georgia,serif;font-size:22px">'+title+'</h2>'+
      '</div>'+
      '<div style="padding:16px 28px 28px;font-size:15px;line-height:1.6;color:#E0E0E0">'+bodyHtml+'</div>'+
      '<div style="background:#0f0f0f;padding:20px 28px;text-align:center;border-top:1px solid #222">'+
        '<p style="margin:0 0 6px;color:#D4AF37;font-weight:bold">THE SHOE DOC</p>'+
        '<p style="margin:0;font-size:12px;color:#888">📍 123 Oxford Street, East London</p>'+
        '<p style="margin:4px 0 0;font-size:12px;color:#888">📞 082-590-2968 · WhatsApp available</p>'+
        '<p style="margin:12px 0 0;font-size:11px;color:#555">© 2026 THE SHOE DOC · All rights reserved</p>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function emailRow(label, value){
  return '<table style="width:100%;border-collapse:collapse;margin:6px 0"><tr>'+
    '<td style="padding:8px 0;color:#888;font-size:13px;width:40%">'+label+'</td>'+
    '<td style="padding:8px 0;color:#fff;font-weight:bold;text-align:right">'+value+'</td>'+
    '</tr></table>';
}

// ============ UI HELPERS ============
var role='admin';

function switchRole(r){
  role=r;
  var tabs=document.querySelectorAll('.tabs button');
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('active',tabs[i].dataset.role===r);
  }
  document.getElementById('adminFields').classList.toggle('hide',r!=='admin');
  document.getElementById('customerFields').classList.toggle('hide',r!=='customer');
  document.getElementById('affiliateFields').classList.toggle('hide',r!=='affiliate');
  document.getElementById('customerSwitch').classList.toggle('hide',r!=='customer');
  showMsg('');
}

function showMsg(t,cls){
  var m=document.getElementById('msg');
  m.textContent=t||'';
  m.className='msg'+(t?' '+(cls||'err'):'');
}

function now(){
  var d=new Date();
  return d.toLocaleString('en-ZA',{timeZone:'Africa/Johannesburg'});
}

// ============ LOGIN ============
function doLogin(){
  // Admin
  if(role==='admin'){
    var u=document.getElementById('aUser').value.trim();
    var p=document.getElementById('aPass').value.trim();
    if(!u||!p){showMsg('❌ Enter username and password','err');return;}
    db.from('settings').select('*').eq('key','admin_password').then(function(r){
      var realPass='admin123';
      if(r.data && r.data.length>0) realPass=r.data[0].value;
      if(u==='admin' && p===realPass){
        showMsg('✅ Login successful! Redirecting...','ok');
        // No email for admin login (to avoid spam)
        setTimeout(function(){location.href='admin.html';},700);
      }else{
        showMsg('❌ Invalid username or password','err');
      }
    });
    return;
  }

  // Customer
  if(role==='customer'){
    var e=document.getElementById('cEmail').value.trim();
    var p2=document.getElementById('cPass').value.trim();
    if(!e||!p2){showMsg('❌ Enter email and password','err');return;}
    db.from('customers').select('*').ilike('email',e).then(function(r){
      if(!r.data||r.data.length===0){showMsg('❌ No account found. Register below.','err');return;}
      var c=r.data[0];
      if(c.password!==p2){showMsg('❌ Wrong password','err');return;}

      // Login notification to customer
      sendMail(c.email,'👋 Welcome back to THE SHOE DOC',
        emailLayout('👋 Welcome Back!',
          '<p style="margin-top:0">Hello <strong style="color:#D4AF37">'+c.name+'</strong>,</p>'+
          '<p>You just signed in to your THE SHOE DOC account.</p>'+
          '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
            emailRow('Email', c.email)+
            emailRow('Time', now())+
          '</div>'+
          '<p style="color:#aaa">If this wasn\'t you, please WhatsApp us on 082-590-2968 immediately.</p>'
        ));

      // Notification to admin
      sendMail(ADMIN_EMAIL,'👤 Customer Login - '+c.name,
        emailLayout('👤 Customer Signed In',
          '<p style="margin-top:0">A customer just logged in:</p>'+
          '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
            emailRow('Name', c.name)+
            emailRow('Email', c.email)+
            emailRow('Phone', c.phone||'-')+
            emailRow('Time', now())+
          '</div>'
        ));

      localStorage.setItem('currentCustomer',JSON.stringify(c));
      showMsg('✅ Welcome '+c.name+'!','ok');
      setTimeout(function(){location.href='dashboard.html';},700);
    });
    return;
  }

  // Affiliate
  if(role==='affiliate'){
    var e2=document.getElementById('fEmail').value.trim();
    var p3=document.getElementById('fPass').value.trim();
    if(!e2||!p3){showMsg('❌ Enter email and password','err');return;}
    db.from('affiliates').select('*').ilike('email',e2).then(function(r){
      if(!r.data||r.data.length===0){showMsg('❌ No affiliate account found','err');return;}
      var a=r.data[0];
      if(a.password!==p3){showMsg('❌ Wrong password','err');return;}

      // Login notification to affiliate
      sendMail(a.email,'👋 Welcome back to THE SHOE DOC Affiliates',
        emailLayout('👋 Welcome Back!',
          '<p style="margin-top:0">Hello <strong style="color:#D4AF37">'+a.name+'</strong>,</p>'+
          '<p>You just signed in to your affiliate dashboard.</p>'+
          '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
            emailRow('Email', a.email)+
            emailRow('Affiliate Code', a.affiliate_code)+
            emailRow('Balance', 'R'+(a.balance||0))+
            emailRow('Time', now())+
          '</div>'+
          '<p style="color:#aaa">If this wasn\'t you, please WhatsApp us on 082-590-2968 immediately.</p>'
        ));

      // Notification to admin
      sendMail(ADMIN_EMAIL,'🤝 Affiliate Login - '+a.name,
        emailLayout('🤝 Affiliate Signed In',
          '<p style="margin-top:0">An affiliate just logged in:</p>'+
          '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
            emailRow('Name', a.name)+
            emailRow('Email', a.email)+
            emailRow('Code', a.affiliate_code)+
            emailRow('Time', now())+
          '</div>'
        ));

      localStorage.setItem('currentAffiliate',JSON.stringify(a));
      showMsg('✅ Welcome '+a.name+'!','ok');
      setTimeout(function(){location.href='affiliate-dashboard.html';},700);
    });
  }
}

// ============ REGISTER ============
function openRegister(){
  document.getElementById('regModal').classList.add('on');
  document.body.style.overflow='hidden';
  ['rName','rEmail','rPhone','rPass','rPass2'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('rMsg').className='msg';
}
function closeRegister(){
  document.getElementById('regModal').classList.remove('on');
  document.body.style.overflow='';
}
document.getElementById('regModal').addEventListener('click',function(e){
  if(e.target===this)closeRegister();
});

function showRMsg(t,cls){
  var m=document.getElementById('rMsg');
  m.textContent=t;
  m.className='msg '+cls;
}

function doRegister(){
  var name=document.getElementById('rName').value.trim();
  var email=document.getElementById('rEmail').value.trim();
  var phone=document.getElementById('rPhone').value.trim();
  var pass=document.getElementById('rPass').value;
  var pass2=document.getElementById('rPass2').value;

  if(!name||!email||!phone||!pass||!pass2){
    showRMsg('❌ Please fill in all fields','err');return;
  }
  if(pass.length<6){showRMsg('❌ Password must be at least 6 characters','err');return;}
  if(pass!==pass2){showRMsg('❌ Passwords do not match','err');return;}

  db.from('customers').select('email').ilike('email',email).then(function(r){
    if(r.data && r.data.length>0){
      showRMsg('❌ This email is already registered','err');
      return;
    }
    var newCust={
      id:Date.now(),
      name:name,
      email:email,
      phone:phone,
      password:pass
    };
    db.from('customers').insert([newCust]).select().then(function(res){
      if(res.error){showRMsg('❌ '+res.error.message,'err');return;}

      // Welcome email to customer
      sendMail(email,'👋 Welcome to THE SHOE DOC!',
        emailLayout('👋 Welcome!',
          '<p style="margin-top:0">Hello <strong style="color:#D4AF37">'+name+'</strong>,</p>'+
          '<p>Your THE SHOE DOC account has been created successfully!</p>'+
          '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
            emailRow('Name', name)+
            emailRow('Email', email)+
            emailRow('Phone', phone)+
          '</div>'+
          '<p>You can now:</p>'+
          '<ul style="color:#aaa;padding-left:20px">'+
            '<li>Track all your bookings</li>'+
            '<li>Earn reward points on every booking</li>'+
            '<li>Get R5 off for every 10 points earned</li>'+
          '</ul>'+
          '<div style="text-align:center;margin:24px 0">'+
            '<a href="https://brysonlakes.github.io/the-shoe-doc/booking.html" style="display:inline-block;background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);color:#000;text-decoration:none;padding:14px 32px;border-radius:50px;font-weight:bold">Book Your First Cleaning →</a>'+
          '</div>'+
          '<p style="color:#aaa">Thanks for joining!<br>THE SHOE DOC Team</p>'
        ));

      // Admin notification
      sendMail(ADMIN_EMAIL,'👤 New Customer Registered - '+name,
        emailLayout('👤 New Customer Registered',
          '<p style="margin-top:0">A new customer just registered:</p>'+
          '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
            emailRow('Name', name)+
            emailRow('Email', email)+
            emailRow('Phone', phone)+
            emailRow('Registered', now())+
          '</div>'+
          '<p style="color:#aaa">Open the admin panel to view all customers.</p>'
        ));

      showRMsg('✅ Account created! Logging you in...','ok');
      localStorage.setItem('currentCustomer',JSON.stringify(res.data[0]));
      setTimeout(function(){location.href='dashboard.html';},1200);
    });
  });
}

// Init
switchRole('admin');
</script>
</body>
</html>
