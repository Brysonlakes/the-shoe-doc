
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE SHOE DOC · Book Now</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E0E0E0;min-height:100vh;padding:40px 20px}
.wrap{max-width:800px;margin:0 auto;text-align:center}
h1{font-family:'Playfair Display',serif;font-size:3rem;color:#fff;margin-bottom:8px}
.gold{background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#888;margin-bottom:32px}
.btn{display:inline-block;padding:14px 32px;border-radius:50px;border:none;cursor:pointer;font-weight:600;font-size:1rem;background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);color:#000;margin:4px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(212,175,55,.4)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;justify-content:center;align-items:center;padding:20px;overflow-y:auto}
.modal.on{display:flex}
.box{background:#141414;max-width:560px;width:100%;border-radius:20px;padding:32px;border:1px solid rgba(212,175,55,.2);max-height:95vh;overflow-y:auto;position:relative;text-align:left}
.close{position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:1.8rem;cursor:pointer}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.85rem;font-weight:600;color:#aaa;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff;font-size:1rem;font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:#D4AF37}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:rgba(255,255,255,.02);padding:8px;border-radius:8px}
.row select{flex:2;padding:8px;border-radius:8px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff}
.row input[type=number]{width:70px;padding:8px;border-radius:8px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff}
.row .pr{color:#D4AF37;font-weight:600;min-width:55px}
.row .rm{background:none;border:none;color:#ff4d4d;cursor:pointer;font-size:1.1rem}
.add{background:transparent;border:1px dashed #333;color:#888;padding:8px;border-radius:30px;cursor:pointer;width:100%;font-size:.9rem}
.add:hover{border-color:#D4AF37;color:#D4AF37}
.total{background:rgba(212,175,55,.05);border:1px solid rgba(212,175,55,.15);border-radius:10px;padding:14px;margin:12px 0}
.total div{display:flex;justify-content:space-between;padding:3px 0}
.total .big{font-size:1.2rem;font-weight:700;color:#D4AF37;border-top:1px solid rgba(255,255,255,.1);margin-top:6px;padding-top:6px}
.ok{display:none;background:rgba(40,167,69,.1);border:1px solid #28a745;border-radius:12px;padding:20px;text-align:center;margin-top:16px}
.ok.on{display:block}
.ok h2{color:#28a745;margin-bottom:8px}
</style>
</head>
<body>

<div class="wrap">
<h1><span class="gold">THE SHOE DOC</span></h1>
<p>Premium shoe cleaning in East London</p>
<a href="https://wa.me/27825902968" class="btn" style="background:#25D366;color:#fff">WhatsApp</a>
<button class="btn" onclick="openModal()">📅 Book Now</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="box">
<button class="close" onclick="closeModal()">&times;</button>

<div id="form">
<h2 style="font-family:'Playfair Display',serif;color:#fff;margin-bottom:16px">📅 Book Your Cleaning</h2>

<div class="fg"><label>Name *</label><input type="text" id="iName" placeholder="Thabo M."></div>
<div class="fg"><label>Phone *</label><input type="tel" id="iPhone" placeholder="082 123 4567"></div>
<div class="fg"><label>Email *</label><input type="email" id="iEmail" placeholder="you@email.com"></div>

<div class="fg">
<label>Services *</label>
<div id="services">
<div class="row">
<select class="svc"><option value="Basic Wash">Basic Wash (R60)</option><option value="Deep Clean">Deep Clean (R100)</option><option value="Premium Care">Premium Care (R150)</option><option value="Sole Whitening">Sole Whitening (R120)</option></select>
<input type="number" class="qty" value="1" min="1" max="20">
<span class="pr">R60</span>
<button class="rm" onclick="rmRow(this)">✕</button>
</div>
</div>
<button class="add" onclick="addRow()">➕ Add Service</button>
</div>

<div class="total">
<div><span>Total Pairs:</span><span id="tPairs">1</span></div>
<div><span>Subtotal:</span><span id="tSub">R60</span></div>
<div class="big"><span>Total:</span><span id="tTotal">R60</span></div>
<div style="font-size:.8rem;color:#888"><span>Deposit:</span><span id="tDep">R30</span></div>
</div>

<div class="fg"><label>Delivery *</label>
<select id="iDel" onchange="calc()"><option value="bring">Bring to shop (Free)</option><option value="fetch">Fetch (R40)</option></select>
</div>

<div class="fg"><label>Payment *</label>
<select id="iPay"><option value="payfast">Payfast (Online)</option><option value="cash">Cash at Shop</option></select>
</div>

<div class="fg"><label>Affiliate Code (optional)</label><input type="text" id="iAff" placeholder="e.g. THO123"></div>
<div class="fg"><label>Date *</label><input type="date" id="iDate"></div>
<div class="fg"><label>Time *</label><input type="time" id="iTime"></div>
<div class="fg"><label>Notes</label><textarea id="iNotes" rows="2"></textarea></div>

<button class="btn" style="width:100%" onclick="submitBooking()">📅 Confirm Booking</button>
</div>

<div class="ok" id="success">
<h2>✅ Booking Submitted!</h2>
<p>You'll receive a confirmation email shortly.</p>
<button class="btn" style="margin-top:12px" onclick="closeModal()">Close</button>
</div>

</div>
</div>

<script>
// ============ SUPABASE ============
const SUPABASE_URL = 'https://nvrsiiwkdsqgtsaokubn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_yiBiiJvpawWZSw1pzVBPLg_gU3-JNJp';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ============ PRICES ============
const PRICES = {'Basic Wash':60,'Deep Clean':100,'Premium Care':150,'Sole Whitening':120};
const DELIVERY_FEE = 40;

// ============ MODAL ============
function openModal(){
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow='hidden';
  document.getElementById('form').style.display='block';
  document.getElementById('success').classList.remove('on');
  const t=new Date();t.setDate(t.getDate()+1);
  document.getElementById('iDate').value=t.toISOString().split('T')[0];
  ['iName','iPhone','iEmail','iAff','iNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('iTime').value='';
  document.getElementById('iDel').value='bring';
  document.getElementById('iPay').value='payfast';
  document.getElementById('services').innerHTML=`
    <div class="row">
      <select class="svc"><option value="Basic Wash">Basic Wash (R60)</option><option value="Deep Clean">Deep Clean (R100)</option><option value="Premium Care">Premium Care (R150)</option><option value="Sole Whitening">Sole Whitening (R120)</option></select>
      <input type="number" class="qty" value="1" min="1" max="20">
      <span class="pr">R60</span>
      <button class="rm" onclick="rmRow(this)">✕</button>
    </div>`;
  bind();
  calc();
}
function closeModal(){
  document.getElementById('modal').classList.remove('on');
  document.body.style.overflow='';
}
function addRow(){
  const div=document.createElement('div');
  div.className='row';
  div.innerHTML=`<select class="svc"><option value="Basic Wash">Basic Wash (R60)</option><option value="Deep Clean">Deep Clean (R100)</option><option value="Premium Care">Premium Care (R150)</option><option value="Sole Whitening">Sole Whitening (R120)</option></select><input type="number" class="qty" value="1" min="1" max="20"><span class="pr">R60</span><button class="rm" onclick="rmRow(this)">✕</button>`;
  document.getElementById('services').appendChild(div);
  bind();
  calc();
}
function rmRow(b){
  const rows=document.querySelectorAll('.row');
  if(rows.length<=1){alert('Need at least one service');return;}
  b.closest('.row').remove();
  calc();
}
function bind(){
  document.querySelectorAll('.svc').forEach(s=>s.onchange=calc);
  document.querySelectorAll('.qty').forEach(q=>q.onchange=calc);
}
function getRows(){
  const arr=[];
  document.querySelectorAll('.row').forEach(r=>{
    const s=r.querySelector('.svc').value;
    const q=parseInt(r.querySelector('.qty').value)||1;
    arr.push({service:s,quantity:q,price:PRICES[s]*q});
  });
  return arr;
}
function calc(){
  const rows=getRows();
  let pairs=0,sub=0;
  rows.forEach(r=>{pairs+=r.quantity;sub+=r.price;});
  document.querySelectorAll('.row').forEach((r,i)=>{r.querySelector('.pr').textContent='R'+rows[i].price;});
  const del=document.getElementById('iDel').value==='fetch'?DELIVERY_FEE:0;
  const total=sub+del;
  const dep=Math.max(30,Math.round(total*0.5));
  document.getElementById('tPairs').textContent=pairs;
  document.getElementById('tSub').textContent='R'+sub;
  document.getElementById('tTotal').textContent='R'+total;
  document.getElementById('tDep').textContent='R'+dep;
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

// ============ SUBMIT ============
async function submitBooking(){
  const name=document.getElementById('iName').value.trim();
  const phone=document.getElementById('iPhone').value.trim();
  const email=document.getElementById('iEmail').value.trim();
  const date=document.getElementById('iDate').value;
  const time=document.getElementById('iTime').value;
  const notes=document.getElementById('iNotes').value.trim();
  const delivery=document.getElementById('iDel').value;
  const payment=document.getElementById('iPay').value;
  const affiliate=document.getElementById('iAff').value.trim().toUpperCase();

  if(!name||!phone||!email||!date||!time){alert('Please fill in all required fields');return;}

  const rows=getRows();
  let pairs=0,sub=0;
  rows.forEach(r=>{pairs+=r.quantity;sub+=r.price;});
  const servicesList=rows.map(r=>r.service+' ('+r.quantity+' pair'+(r.quantity>1?'s':'')+')').join(', ');
  const deliveryFee=delivery==='fetch'?DELIVERY_FEE:0;
  const deposit=Math.max(30,Math.round((sub+deliveryFee)*0.5));
  const invoice='INV-'+Date.now().toString().slice(-8);
  const pointsEarned=Math.floor(sub/10);

  const booking={
    id:Date.now(),
    invoice:invoice,
    customer:name,
    phone:phone,
    email:email,
    services_list:servicesList,
    total_pairs:pairs,
    subtotal:sub,
    date:date,
    time:time,
    notes:notes,
    delivery_option:delivery,
    delivery_address:'N/A',
    deposit:deposit,
    delivery_fee:deliveryFee,
    total_due:deposit+deliveryFee,
    payment_method:payment,
    affiliate_code:affiliate||null,
    status:payment==='cash'?'confirmed':'pending_payment',
    paid:false
  };

  const result=await sb.from('bookings').insert([booking]);
  if(result.error){
    alert('Error saving booking: '+result.error.message);
    return;
  }

  if(email){
    const r=await sb.from('rewards').select('*').eq('email',email).single();
    if(r.data){
      await sb.from('rewards').update({points:(r.data.points||0)+pointsEarned,total_earned:(r.data.total_earned||0)+pointsEarned}).eq('email',email);
    }else{
      await sb.from('rewards').insert([{email,points:pointsEarned,total_earned:pointsEarned,used:0}]);
    }
  }

  if(affiliate){
    const a=await sb.from('affiliates').select('*').eq('affiliate_code',affiliate).single();
    if(a.data){
      const commission=pairs*20;
      await sb.from('affiliates').update({
        balance:(a.data.balance||0)+commission,
        total_earned:(a.data.total_earned||0)+commission
      }).eq('id',a.data.id);
    }
  }

  sendMail('https://formspree.io/f/xoeqprgy',{
    _subject:'✅ Booking Confirmed - THE SHOE DOC',
    customer:name,phone:phone,email:email,
    services:servicesList,pairs:pairs,date:date,time:time,
    total:'R'+(deposit+deliveryFee)
  });

  sendMail('https://formspree.io/f/mkjnpyda',{
    _subject:'📦 New Booking - THE SHOE DOC',
    customer:name,phone:phone,email:email,
    services:servicesList,pairs:pairs,date:date,time:time,
    total:'R'+(deposit+deliveryFee)
  });

  document.getElementById('form').style.display='none';
  document.getElementById('success').classList.add('on');
}

function sendMail(action,fields){
  const f=document.createElement('form');
  f.method='POST';f.action=action;f.target='_blank';f.style.display='none';
  Object.keys(fields).forEach(k=>{
    const i=document.createElement('input');
    i.type='hidden';i.name=k;i.value=fields[k];
    f.appendChild(i);
  });
  document.body.appendChild(f);
  f.submit();
  document.body.removeChild(f);
}
</script>
</body>
</html>
