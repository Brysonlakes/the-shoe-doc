<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE SHOE DOC · Book Now</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E0E0E0;min-height:100vh;padding:40px 20px}
.wrap{max-width:800px;margin:0 auto;text-align:center}
h1{font-family:'Playfair Display',serif;font-size:3rem;color:#fff;margin-bottom:8px}
.gold{background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#888;margin-bottom:32px}
.btn{display:inline-block;padding:14px 32px;border-radius:50px;border:none;cursor:pointer;font-weight:600;font-size:1rem;background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);color:#000;margin:4px}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(212,175,55,.4)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;justify-content:center;align-items:center;padding:20px;overflow-y:auto}
.modal.on{display:flex}
.box{background:#141414;max-width:560px;width:100%;border-radius:20px;padding:32px;border:1px solid rgba(212,175,55,.2);max-height:95vh;overflow-y:auto;position:relative;text-align:left}
.close{position:absolute;top:12px;right:16px;background:none;border:none;color:#888;font-size:1.8rem;cursor:pointer}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:.85rem;font-weight:600;color:#aaa;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff;font-size:1rem;font-family:inherit;outline:none}
.fg input:focus,.fg select:focus{border-color:#D4AF37}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;background:rgba(255,255,255,.02);padding:8px;border-radius:8px}
.row select{flex:2;padding:8px;border-radius:8px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff}
.row input[type=number]{width:70px;padding:8px;border-radius:8px;border:1px solid #2a2a2a;background:#0f0f0f;color:#fff}
.row .pr{color:#D4AF37;font-weight:600;min-width:55px}
.row .rm{background:none;border:none;color:#ff4d4d;cursor:pointer;font-size:1.1rem}
.add{background:transparent;border:1px dashed #333;color:#888;padding:8px;border-radius:30px;cursor:pointer;width:100%;font-size:.9rem}
.add:hover{border-color:#D4AF37;color:#D4AF37}
.total{background:rgba(212,175,55,.05);border:1px solid rgba(212,175,55,.15);border-radius:10px;padding:14px;margin:12px 0}
.total div{display:flex;justify-content:space-between;padding:3px 0}
.total .big{font-size:1.2rem;font-weight:700;color:#D4AF37;border-top:1px solid rgba(255,255,255,.1);margin-top:6px;padding-top:6px}
.ok{display:none;background:rgba(40,167,69,.1);border:1px solid #28a745;border-radius:12px;padding:20px;text-align:center;margin-top:16px}
.ok.on{display:block}
.ok h2{color:#28a745;margin-bottom:8px}
</style>
</head>
<body>

<div class="wrap">
<h1><span class="gold">THE SHOE DOC</span></h1>
<p>Premium shoe cleaning in East London</p>
<a href="https://wa.me/27825902968" class="btn" style="background:#25D366;color:#fff">WhatsApp</a>
<button class="btn" onclick="openModal()">📅 Book Now</button>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="box">
<button class="close" onclick="closeModal()">&times;</button>

<div id="form">
<h2 style="font-family:'Playfair Display',serif;color:#fff;margin-bottom:16px">📅 Book Your Cleaning</h2>

<div class="fg"><label>Name *</label><input type="text" id="iName" placeholder="Thabo M."></div>
<div class="fg"><label>Phone *</label><input type="tel" id="iPhone" placeholder="082 123 4567"></div>
<div class="fg"><label>Email *</label><input type="email" id="iEmail" placeholder="you@email.com"></div>

<div class="fg">
<label>Services *</label>
<div id="services">
<div class="row">
<select class="svc"><option value="Basic Wash">Basic Wash (R60)</option><option value="Deep Clean">Deep Clean (R100)</option><option value="Premium Care">Premium Care (R150)</option><option value="Sole Whitening">Sole Whitening (R120)</option></select>
<input type="number" class="qty" value="1" min="1" max="20">
<span class="pr">R60</span>
<button class="rm" onclick="rmRow(this)">✕</button>
</div>
</div>
<button class="add" onclick="addRow()">➕ Add Service</button>
</div>

<div class="total">
<div><span>Total Pairs:</span><span id="tPairs">1</span></div>
<div><span>Subtotal:</span><span id="tSub">R60</span></div>
<div class="big"><span>Total:</span><span id="tTotal">R60</span></div>
<div id="depositRow" style="font-size:.8rem;color:#888"><span>Deposit (50%):</span><span id="tDep">R30</span></div>
<div id="cashRow" style="font-size:.8rem;color:#D4AF37;display:none;font-weight:600"><span>Cash Due at Shop:</span><span id="tCash">R60</span></div>
</div>

<div class="fg"><label>Delivery *</label>
<select id="iDel" onchange="calc()"><option value="bring">Bring to shop (Free)</option><option value="fetch">Fetch (R40)</option></select>
</div>

<div class="fg"><label>Payment *</label>
<select id="iPay" onchange="calc()"><option value="payfast">Payfast (Online)</option><option value="cash">Cash at Shop</option></select>
</div>

<div class="fg"><label>Affiliate Code (optional)</label><input type="text" id="iAff" placeholder="e.g. THO123"></div>
<div class="fg"><label>Date *</label><input type="date" id="iDate"></div>
<div class="fg"><label>Time *</label><input type="time" id="iTime"></div>
<div class="fg"><label>Notes</label><textarea id="iNotes" rows="2"></textarea></div>

<button class="btn" style="width:100%" onclick="submitBooking()">📅 Confirm Booking</button>
</div>

<div class="ok" id="success">
<h2>✅ Booking Submitted!</h2>
<p>You'll receive a confirmation email shortly.</p>
<button class="btn" style="margin-top:12px" onclick="closeModal()">Close</button>
</div>

</div>
</div>

<script>
// ============ SUPABASE ============
var SB_URL='https://nvrsiiwkdsqgtsaokubn.supabase.co';
var SB_KEY='sb_publishable_yiBiiJvpawWZSw1pzVBPLg_gU3-JNJp';
var sb=window.supabase.createClient(SB_URL,SB_KEY);

// ============ BREVO ============
var BREVO_KEY='';
var SENDER_EMAIL='theshoedoc3@gmail.com';
var SENDER_NAME='THE SHOE DOC';

sb.from('settings').select('*').eq('key','brevo_api_key').then(function(r){
  if(r.data && r.data.length>0){
    BREVO_KEY=r.data[0].value;
    console.log('✅ Brevo key loaded');
  }else{
    console.warn('⚠️ Brevo key missing');
  }
});

function sendMail(toEmail, subject, htmlContent){
  if(!BREVO_KEY){console.warn('⚠️ Email skipped — key not loaded');return;}
  fetch('https://api.brevo.com/v3/smtp/email',{
    method:'POST',
    headers:{'accept':'application/json','content-type':'application/json','api-key':BREVO_KEY},
    body:JSON.stringify({
      sender:{name:SENDER_NAME,email:SENDER_EMAIL},
      to:[{email:toEmail}],
      subject:subject,
      htmlContent:htmlContent
    })
  }).then(function(r){
    if(r.ok)console.log('✅ Email sent to '+toEmail);
    else r.json().then(function(e){console.error('❌ Brevo error:',e);});
  }).catch(function(err){console.error('❌ Network:',err);});
}

// ============ EMAIL TEMPLATE ============
function emailLayout(title, bodyHtml){
  return ''+
  '<div style="font-family:Arial,Helvetica,sans-serif;background:#0A0A0A;padding:30px 15px;color:#E0E0E0">'+
    '<div style="max-width:560px;margin:0 auto;background:#141414;border:1px solid #D4AF37;border-radius:16px;overflow:hidden">'+
      '<div style="background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);padding:24px;text-align:center">'+
        '<h1 style="margin:0;font-family:Georgia,serif;font-size:26px;color:#000;letter-spacing:2px">THE SHOE DOC</h1>'+
        '<p style="margin:4px 0 0;font-size:12px;color:#3a2a00">Premium Shoe Cleaning · East London</p>'+
      '</div>'+
      '<div style="padding:24px 28px 0">'+
        '<h2 style="margin:0;color:#D4AF37;font-family:Georgia,serif;font-size:22px">'+title+'</h2>'+
      '</div>'+
      '<div style="padding:16px 28px 28px;font-size:15px;line-height:1.6;color:#E0E0E0">'+
        bodyHtml+
      '</div>'+
      '<div style="background:#0f0f0f;padding:20px 28px;text-align:center;border-top:1px solid #222">'+
        '<p style="margin:0 0 6px;color:#D4AF37;font-weight:bold">THE SHOE DOC</p>'+
        '<p style="margin:0;font-size:12px;color:#888">📍 123 Oxford Street, East London</p>'+
        '<p style="margin:4px 0 0;font-size:12px;color:#888">📞 082-590-2968 · WhatsApp available</p>'+
        '<p style="margin:12px 0 0;font-size:11px;color:#555">© 2026 THE SHOE DOC · All rights reserved</p>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function emailRow(label, value){
  return '<table style="width:100%;border-collapse:collapse;margin:6px 0">'+
    '<tr>'+
    '<td style="padding:8px 0;color:#888;font-size:13px;width:40%">'+label+'</td>'+
    '<td style="padding:8px 0;color:#fff;font-weight:bold;text-align:right">'+value+'</td>'+
    '</tr>'+
    '</table>';
}

// ============ PRICES ============
var PRICES={'Basic Wash':60,'Deep Clean':100,'Premium Care':150,'Sole Whitening':120};
var DELIVERY_FEE=40;

function openModal(){
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow='hidden';
  document.getElementById('form').style.display='block';
  document.getElementById('success').classList.remove('on');
  var t=new Date();t.setDate(t.getDate()+1);
  document.getElementById('iDate').value=t.toISOString().split('T')[0];
  ['iName','iPhone','iEmail','iAff','iNotes'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('iTime').value='';
  document.getElementById('iDel').value='bring';
  document.getElementById('iPay').value='payfast';
  document.getElementById('services').innerHTML=
    '<div class="row">'+
    '<select class="svc"><option value="Basic Wash">Basic Wash (R60)</option><option value="Deep Clean">Deep Clean (R100)</option><option value="Premium Care">Premium Care (R150)</option><option value="Sole Whitening">Sole Whitening (R120)</option></select>'+
    '<input type="number" class="qty" value="1" min="1" max="20">'+
    '<span class="pr">R60</span>'+
    '<button class="rm" onclick="rmRow(this)">✕</button>'+
    '</div>';
  bind();
  calc();
}
function closeModal(){
  document.getElementById('modal').classList.remove('on');
  document.body.style.overflow='';
}
function addRow(){
  var div=document.createElement('div');
  div.className='row';
  div.innerHTML='<select class="svc"><option value="Basic Wash">Basic Wash (R60)</option><option value="Deep Clean">Deep Clean (R100)</option><option value="Premium Care">Premium Care (R150)</option><option value="Sole Whitening">Sole Whitening (R120)</option></select><input type="number" class="qty" value="1" min="1" max="20"><span class="pr">R60</span><button class="rm" onclick="rmRow(this)">✕</button>';
  document.getElementById('services').appendChild(div);
  bind();
  calc();
}
function rmRow(b){
  var rows=document.querySelectorAll('.row');
  if(rows.length<=1){alert('Need at least one service');return;}
  b.closest('.row').remove();
  calc();
}
function bind(){
  document.querySelectorAll('.svc').forEach(function(s){s.onchange=calc;});
  document.querySelectorAll('.qty').forEach(function(q){q.onchange=calc;});
}
function getRows(){
  var arr=[];
  document.querySelectorAll('.row').forEach(function(r){
    var s=r.querySelector('.svc').value;
    var q=parseInt(r.querySelector('.qty').value)||1;
    arr.push({service:s,quantity:q,price:PRICES[s]*q});
  });
  return arr;
}
function calc(){
  var rows=getRows();
  var pairs=0,sub=0;
  rows.forEach(function(r){pairs+=r.quantity;sub+=r.price;});
  document.querySelectorAll('.row').forEach(function(r,i){r.querySelector('.pr').textContent='R'+rows[i].price;});
  var del=document.getElementById('iDel').value==='fetch'?DELIVERY_FEE:0;
  var total=sub+del;
  var dep=Math.max(30,Math.round(total*0.5));
  document.getElementById('tPairs').textContent=pairs;
  document.getElementById('tSub').textContent='R'+sub;
  document.getElementById('tTotal').textContent='R'+total;
  document.getElementById('tDep').textContent='R'+dep;
  document.getElementById('tCash').textContent='R'+total;

  // Show deposit or cash row based on payment method
  var pay=document.getElementById('iPay').value;
  document.getElementById('depositRow').style.display=(pay==='cash')?'none':'block';
  document.getElementById('cashRow').style.display=(pay==='cash')?'block':'none';
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal();});

// ============ SUBMIT ============
function submitBooking(){
  var name=document.getElementById('iName').value.trim();
  var phone=document.getElementById('iPhone').value.trim();
  var email=document.getElementById('iEmail').value.trim();
  var date=document.getElementById('iDate').value;
  var time=document.getElementById('iTime').value;
  var notes=document.getElementById('iNotes').value.trim();
  var delivery=document.getElementById('iDel').value;
  var payment=document.getElementById('iPay').value;
  var affiliate=document.getElementById('iAff').value.trim().toUpperCase();

  if(!name||!phone||!email||!date||!time){alert('Please fill in all required fields');return;}

  var rows=getRows();
  var pairs=0,sub=0;
  rows.forEach(function(r){pairs+=r.quantity;sub+=r.price;});
  var servicesList=rows.map(function(r){return r.service+' ('+r.quantity+' pair'+(r.quantity>1?'s':'')+')';}).join(', ');
    var deliveryFee=delivery==='fetch'?DELIVERY_FEE:0;
  var fullTotal=sub+deliveryFee;
  var deposit=Math.max(30,Math.round(fullTotal*0.5));

  // For cash, the full amount is due at the shop
  if(payment==='cash'){
    deposit=fullTotal;      // full amount due
  }

  var invoice='INV-'+Date.now().toString().slice(-8);
  var pointsEarned=Math.floor(sub/10);

  var booking={
    id:Date.now(),
    invoice:invoice,
    customer:name,
    phone:phone,
    email:email,
    services_list:servicesList,
    total_pairs:pairs,
    subtotal:sub,
    date:date,
    time:time,
    notes:notes,
    delivery_option:delivery,
    delivery_address:'N/A',
    deposit:deposit,
    delivery_fee:deliveryFee,
    total_due:(payment==='cash')?fullTotal:(deposit+deliveryFee),
    payment_method:payment,
     payment_confirmed:false,
    affiliate_code:affiliate||null,
    status:payment==='cash'?'confirmed':'pending_payment',
    paid:false
  };

  sb.from('bookings').insert([booking]).then(function(result){
    if(result.error){alert('Error saving booking: '+result.error.message);return;}

    if(email){
      sb.from('rewards').select('*').eq('email',email).then(function(r){
        if(r.data && r.data.length>0){
          var cur=r.data[0];
          sb.from('rewards').update({
            points:(cur.points||0)+pointsEarned,
            total_earned:(cur.total_earned||0)+pointsEarned
          }).eq('email',email);
        }else{
          sb.from('rewards').insert([{email:email,points:pointsEarned,total_earned:pointsEarned,used:0}]);
        }
      });
    }

             if(affiliate){
      sb.from('affiliates').select('*').eq('affiliate_code',affiliate).then(function(a){
        if(a.data && a.data.length>0){
          var aff=a.data[0];
          var commission=pairs*20;
          var newBalance=(aff.balance||0)+commission;
          sb.from('affiliates').update({
            balance:newBalance,
            total_earned:(aff.total_earned||0)+commission
          }).eq('id',aff.id).then(function(upd){
            if(upd.error){
              console.error('Affiliate update failed:',upd.error);
            }else{
              console.log('Affiliate balance updated to R'+newBalance);
              sendMail(aff.email,'You earned R'+commission+' - THE SHOE DOC',
                emailLayout('You Just Earned a Commission!',
                  '<p style="margin-top:0">Hello <strong style="color:#D4AF37">'+aff.name+'</strong>,</p>'+
                  '<p>A customer just used your affiliate code!</p>'+
                  '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
                    emailRow('Customer', name)+
                    emailRow('Total Pairs', pairs)+
                    emailRow('You Earned', 'R'+commission)+
                    emailRow('New Balance', 'R'+newBalance)+
                  '</div>'+
                  '<p style="color:#aaa">Keep sharing your code!</p>'
                ));
            }
          });
        }else{
          console.warn('No affiliate found with code:', affiliate);
        }
      });
    }

          // Notify affiliate they earned a commission
          sendMail(aff.email,'💰 You earned R'+commission+'! - THE SHOE DOC',
            emailLayout('💰 You Just Earned a Commission!',
              '<p style="margin-top:0">Hello <strong style="color:#D4AF37">'+aff.name+'</strong>,</p>'+
              '<p>Great news — a customer just used your affiliate code!</p>'+
              '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
                emailRow('Customer', name)+
                emailRow('Services', servicesList)+
                emailRow('Total Pairs', pairs)+
                emailRow('You Earned', 'R'+commission)+
                emailRow('New Balance', 'R'+newBalance)+
              '</div>'+
              '<p style="color:#aaa">Keep sharing your code <strong style="color:#D4AF37">'+aff.affiliate_code+'</strong> to earn more!</p>'+
              '<div style="text-align:center;margin:24px 0">'+
                '<a href="https://brysonlakes.github.io/the-shoe-doc/affiliate-dashboard.html" style="display:inline-block;background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);color:#000;text-decoration:none;padding:14px 32px;border-radius:50px;font-weight:bold">View My Dashboard →</a>'+
              '</div>'
            ));
        }
      });
    }

    // CUSTOMER EMAIL — graphical
    sendMail(
      email,
      '✅ Booking Confirmed - THE SHOE DOC',
      emailLayout('✅ Booking Confirmed',
        '<p style="margin-top:0">Hello <strong style="color:#D4AF37">'+name+'</strong>,</p>'+
        '<p>Thank you for your booking! Here are your details:</p>'+
        '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
          emailRow('Invoice', invoice)+
          emailRow('Services', servicesList)+
          emailRow('Total Pairs', pairs)+
          emailRow('Date', date)+
          emailRow('Time', time)+
            (payment==='cash'
          ? emailRow('Amount Due at Shop', 'R'+fullTotal)
          : emailRow('Deposit Due Now', 'R'+deposit)+emailRow('Balance at Shop', 'R'+((fullTotal-deposit)))
          )+
          emailRow('Total', 'R'+fullTotal)+
        '</div>'+
        '<p style="color:#aaa">We will contact you shortly to confirm your booking.</p>'+
        '<p style="color:#aaa">Need to change anything? Reply to this email or WhatsApp us on <strong style="color:#D4AF37">082-590-2968</strong>.</p>'
      )
    );

    // ADMIN EMAIL — graphical
    sendMail(
      'theshoedoc3@gmail.com',
      '📦 New Booking - '+name,
      emailLayout('📦 New Booking Received',
        '<p style="margin-top:0">A new booking came in from <strong style="color:#D4AF37">'+name+'</strong>.</p>'+
        '<div style="background:#0f0f0f;border-radius:10px;padding:14px 18px;margin:14px 0;border-left:3px solid #D4AF37">'+
          emailRow('Customer', name)+
          emailRow('Phone', phone)+
          emailRow('Email', email)+
          emailRow('Services', servicesList)+
          emailRow('Total Pairs', pairs)+
          emailRow('Date', date)+
          emailRow('Time', time)+
          emailRow('Total', 'R'+fullTotal)+
          emailRow('Payment', payment)+
          (payment==='cash'
            ? emailRow('Cash Due at Shop', 'R'+fullTotal)
            : emailRow('Deposit Due Now', 'R'+deposit)+emailRow('Balance at Shop', 'R'+((fullTotal-deposit)))
          )+
        '</div>'+
        '<p style="color:#aaa">Open the admin panel to manage this booking.</p>'
      )
    );

    document.getElementById('form').style.display='none';
    document.getElementById('success').classList.add('on');
  });
}
</script>
</body>
</html>
