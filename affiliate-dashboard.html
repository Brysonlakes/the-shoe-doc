<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE SHOE DOC · Affiliate Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#E0E0E0;padding:20px;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto}
.head{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.05);margin-bottom:30px;flex-wrap:wrap;gap:12px}
.head h1{font-family:'Playfair Display',serif;font-size:1.5rem;color:#fff}
.gold{background:linear-gradient(135deg,#F9D976,#D4AF37,#B8860B);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:8px 20px;border:1px solid #333;border-radius:30px;background:transparent;color:#aaa;cursor:pointer;font-weight:500;text-decoration:none;font-size:.9rem;display:inline-block}
.btn:hover{border-color:#D4AF37;color:#D4AF37}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat{background:#141414;padding:16px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.04)}
.stat .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:#666}
.stat .val{font-family:'Playfair Display',serif;font-size:1.8rem;color:#D4AF37;margin-top:4px}
.panel{background:#141414;padding:24px 28px;border-radius:20px;border:1px solid rgba(255,255,255,.04);margin-bottom:24px}
.panel h3{font-family:'Playfair Display',serif;color:#fff;font-size:1.2rem;margin-bottom:16px;border-left:4px solid #D4AF37;padding-left:12px}
.codebox{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);border-radius:12px;padding:20px;text-align:center;margin-bottom:12px}
.codebox .code{font-size:2.5rem;font-weight:700;color:#D4AF37;letter-spacing:4px;font-family:monospace;word-break:break-all}
.codebox p{color:#888;margin-top:4px;font-size:.85rem}
.copy{background:transparent;border:1px solid #333;color:#aaa;padding:6px 16px;border-radius:30px;cursor:pointer;font-size:.8rem;margin-top:8px}
.copy:hover{border-color:#D4AF37;color:#D4AF37}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;padding:10px 8px;color:#888;font-weight:600;text-transform:uppercase;font-size:.65rem;letter-spacing:1px;border-bottom:1px solid #222}
td{padding:10px 8px;border-bottom:1px solid #1a1a1a}
.empty{text-align:center;padding:30px 20px;color:#666}
.empty .ic{font-size:2.5rem;margin-bottom:8px}
.banner{padding:16px;border-radius:12px;margin-bottom:20px;font-size:.95rem;text-align:center}
.banner.info{background:rgba(23,162,184,.1);border:1px solid #17a2b8;color:#17a2b8}
.banner.err{background:rgba(255,77,77,.1);border:1px solid #ff4d4d;color:#ff4d4d}
.banner.ok{background:rgba(40,167,69,.1);border:1px solid #28a745;color:#28a745}
@media(max-width:480px){.head h1{font-size:1.1rem}.panel{padding:20px 16px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head">
<h1>💰 <span class="gold">Affiliate Dashboard</span></h1>
<div>
<a href="affiliate-register.html" class="btn">📝 Register</a>
<a href="index.html" class="btn" onclick="logout()">🚪 Logout</a>
</div>
</div>

<div id="banner" class="banner info">⏳ Loading...</div>

<div id="content" style="display:none">
<div class="grid">
<div class="stat"><div class="lbl">Total Earnings</div><div class="val" id="sEarn">R0</div></div>
<div class="stat"><div class="lbl">Balance</div><div class="val" id="sBal">R0</div></div>
<div class="stat"><div class="lbl">Referrals</div><div class="val" id="sRef">0</div></div>
<div class="stat"><div class="lbl">Downline</div><div class="val" id="sDown">0</div></div>
</div>

<div class="panel">
<h3>🔗 Your Affiliate Code</h3>
<div class="codebox">
<div class="code" id="affCode">------</div>
<p>Share this code. You earn <strong>R20 per pair</strong> booked.</p>
<button class="copy" onclick="copyCode()">📋 Copy Code</button>
</div>
</div>

<div class="panel">
<h3>📊 Referral History</h3>
<div id="refList"></div>
</div>

<div class="panel">
<h3>👥 Downline Affiliates</h3>
<div id="downList"></div>
</div>

<div class="panel">
<h3>🏦 Bank Details</h3>
<div id="bankBox"></div>
</div>
</div>
</div>

<script>
var SB_URL='https://nvrsiiwkdsqgtsaokubn.supabase.co';
var SB_KEY='sb_publishable_yiBiiJvpawWZSw1pzVBPLg_gU3-JNJp';
var db=window.supabase.createClient(SB_URL,SB_KEY);

function logout(){
  localStorage.removeItem('currentAffiliate');
  location.href='index.html';
}

function copyCode(){
  var c=document.getElementById('affCode').textContent;
  navigator.clipboard.writeText(c).then(function(){alert('Copied: '+c);});
}

function setBanner(t,cls){
  var b=document.getElementById('banner');
  b.textContent=t;
  b.className='banner '+cls;
  b.style.display='block';
}

function load(){
  var stored=localStorage.getItem('currentAffiliate');
  if(!stored){
    setBanner('❌ Not logged in. Go to Login or Register.','err');
    return;
  }
  var current;
  try{current=JSON.parse(stored);}catch(e){
    setBanner('❌ Corrupt session. Please register again.','err');
    return;
  }

  setBanner('⏳ Loading dashboard for '+current.email+'...','info');

    var emailLower=(current.email||'').trim().toLowerCase();
  db.from('affiliates').select('*').ilike('email',emailLower).then(function(r){
    if(r.error){
      setBanner('❌ Supabase error: '+r.error.message,'err');
      return;
    }
    if(!r.data||r.data.length===0){
      setBanner('❌ No affiliate found for '+emailLower+'. Please register again.','err');
      return;
    }
    var a=r.data[0];
    setBanner('✅ Welcome back, '+a.name+'!','ok');

    document.getElementById('content').style.display='block';
    document.getElementById('sEarn').textContent='R'+(a.total_earned||0);
    document.getElementById('sBal').textContent='R'+(a.balance||0);
    document.getElementById('affCode').textContent=a.affiliate_code;

    document.getElementById('bankBox').innerHTML=
      '<p><strong>Bank:</strong> '+(a.bank_name||'Not set')+'</p>'+
      '<p style="margin-top:6px"><strong>Account:</strong> '+(a.account_number||'Not set')+'</p>';

    // Referrals
    db.from('bookings').select('*').eq('affiliate_code',a.affiliate_code).then(function(b){
      var bookings=b.data||[];
      document.getElementById('sRef').textContent=bookings.length;

      if(bookings.length===0){
        document.getElementById('refList').innerHTML='<div class="empty"><div class="ic">📭</div><p>No referrals yet. Share your code!</p></div>';
      }else{
        var html='<table><thead><tr><th>Customer</th><th>Service</th><th>Pairs</th><th>Date</th><th>Commission</th></tr></thead><tbody>';
        for(var i=0;i<bookings.length;i++){
          var bk=bookings[i];
          var pairs=bk.total_pairs||1;
          html+='<tr><td><strong>'+(bk.customer||'')+'</strong></td>'+
                '<td>'+(bk.services_list||'N/A')+'</td>'+
                '<td>'+pairs+'</td>'+
                '<td>'+(bk.date||'')+'</td>'+
                '<td style="color:#D4AF37;font-weight:700">R'+(pairs*20)+'</td></tr>';
        }
        html+='</tbody></table>';
        document.getElementById('refList').innerHTML=html;
      }

      // Downline
      var down=a.downline||[];
      document.getElementById('sDown').textContent=down.length;

      if(down.length===0){
        document.getElementById('downList').innerHTML='<div class="empty"><div class="ic">👤</div><p>No downline affiliates yet.</p></div>';
      }else{
        db.from('affiliates').select('*').in('id',down).then(function(d){
          var list=d.data||[];
          if(list.length===0){
            document.getElementById('downList').innerHTML='<div class="empty"><div class="ic">👤</div><p>No downline affiliates yet.</p></div>';
            return;
          }
          var h2='<table><thead><tr><th>Name</th><th>Email</th><th>Code</th><th>Status</th></tr></thead><tbody>';
          for(var j=0;j<list.length;j++){
            var x=list[j];
            h2+='<tr><td><strong>'+x.name+'</strong></td>'+
                '<td>'+x.email+'</td>'+
                '<td>'+x.affiliate_code+'</td>'+
                '<td style="color:'+(x.status==='active'?'#28a745':'#ffc107')+'">'+x.status+'</td></tr>';
          }
          h2+='</tbody></table>';
          document.getElementById('downList').innerHTML=h2;
        });
      }

      localStorage.setItem('currentAffiliate',JSON.stringify(a));
    });
  });
}

load();
</script>
</body>
</html>
